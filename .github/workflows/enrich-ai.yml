name: Enriquecimento Semântico por IA (Google AI Studio)

on:
  schedule:
    # Executa diariamente às 04:00 UTC (madrugada)
    - cron: "0 4 * * *"
  workflow_dispatch: # Permite disparo manual com configuração de parâmetros
    inputs:
      limit:
        description: "Quantidade máxima de projetos a enriquecer"
        required: false
        default: "300"
        type: string
      concurrency:
        description: "Número de workers concorrentes (1 a 4)"
        required: false
        default: "3"
        type: string
      proposicao_id:
        description: "ID de uma Proposição específica (opcional, ex: 2256735)"
        required: false
        default: ""
        type: string
      force:
        description: "Forçar reprocessamento de matérias já enriquecidas"
        required: false
        default: false
        type: boolean

jobs:
  enrich-vote-sessions:
    name: Enriquecer Proposições e Deliberações com Gemini
    runs-on: ubuntu-latest
    timeout-minutes: 45

    environment: prd
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Pipeline Unificado de Enriquecimento por IA
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ inputs.proposicao_id }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --proposicao=${{ inputs.proposicao_id }}"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --force"
          fi
          npm run enrich:ai -- --limit=${{ inputs.limit || '300' }} --concurrency=${{ inputs.concurrency || '3' }} $EXTRA_ARGS
