name: 🚀 Auto Release & Semantic Versioning

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    name: Create Semantic Release
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: prd
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🏷️ Calculate Next Semantic Version
        id: bump
        run: |
          node scripts/release/bump-version.js
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}

      - name: 👤 Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 💾 Commit Version Bump & Create Git Tag
        run: |
          git add package.json
          git commit -m "chore(release): v${{ steps.bump.outputs.new_version }} [skip ci]"
          git tag -a "v${{ steps.bump.outputs.new_version }}" -m "Release v${{ steps.bump.outputs.new_version }}"
          git push origin main
          git push origin "v${{ steps.bump.outputs.new_version }}"

      - name: 📢 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.bump.outputs.new_version }}"
          name: "v${{ steps.bump.outputs.new_version }}"
          body: |
            ## 🏛️ LegisVisão v${{ steps.bump.outputs.new_version }}

            - **Tipo de Versão:** `${{ steps.bump.outputs.bump_type }}`
            - **Pull Request:** #${{ github.event.pull_request.number }} (${{ github.event.pull_request.title }})
            - **Branch de Origem:** `${{ github.event.pull_request.head.ref }}`

            ### 📝 Detalhes da Atualização:
            ${{ github.event.pull_request.body }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
